name: Release Package (No ReShade)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
          uses: actions/checkout@v4
          with:
            lfs: true
            fetch-depth: 0

      - name: Build zip package (exclude reshade, git metadata)
        env:
          ASSET_NAME: game_local-${{ github.ref_name }}-no-reshade.zip
        run: |
          ASSET_PATH="/tmp/${ASSET_NAME}"
          # Exclude repo metadata and reshade directory; ensure patterns match files
          zip -r "${ASSET_PATH}" . -x "./.git/*" "./.github/*" "reshade/*" ".gitignore" ".gitattributes"
          echo "ASSET_PATH=${ASSET_PATH}" >> "${GITHUB_ENV}"

      - name: Upload asset to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_PATH }}
          fail_on_unmatched_files: true
