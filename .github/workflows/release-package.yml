name: Release Package (No ReShade)

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build zip package (exclude reshade)
        env:
          ASSET_NAME: game_local-${{ github.ref_name }}-no-reshade.zip
        run: |
          ASSET_PATH="/tmp/${ASSET_NAME}"
          zip -r "${ASSET_PATH}" . -x "reshade/**" ".git/**" ".github/**" ".gitignore" ".gitattributes"
          echo "ASSET_PATH=${ASSET_PATH}" >> "${GITHUB_ENV}"

      - name: Upload asset to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_PATH }}
          fail_on_unmatched_files: true
